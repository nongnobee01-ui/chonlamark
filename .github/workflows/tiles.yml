name: fetch-satellite-tiles
on:
  push:
    branches: [assets]
    paths: [fetch_tiles.py, .github/workflows/tiles.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch_tiles.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add tiles
          git commit -m "Satellite tiles (Esri World Imagery) for poster" || echo "no changes"
          git push
